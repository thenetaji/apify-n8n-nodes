name: CI

on:
  pull_request:
  push:
    branches:
      - main

# Cancel in-progress runs for the same branch/PR to avoid wasting CI minutes.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Each package carries its own pnpm-workspace.yaml and lockfile, so it is its
  # own pnpm root and is checked independently. That also means one broken
  # package does not mask the others.
  package:
    name: ${{ matrix.package }}
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        package:
          - pinterest
          - tiktok
          - tiktok-shop
          - youtube-downloader
          - youtube-scraper

    defaults:
      run:
        working-directory: packages/${{ matrix.package }}

    steps:
      - uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: packages/${{ matrix.package }}/.nvmrc
          cache: 'pnpm'
          cache-dependency-path: packages/${{ matrix.package }}/pnpm-lock.yaml

      # --ignore-scripts skips the native builds (isolated-vm and friends) that
      # only the local `n8n-node dev` runtime needs. Linting, compiling and the
      # unit tests do not touch them, and building them here costs minutes.
      - name: Install dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Lint
        run: pnpm run lint

      - name: Build
        run: pnpm run build

      - name: Test
        run: pnpm test

  # A runtime dependency in any package would fail n8n's verification review,
  # so it is cheaper to catch it here than after submitting. No install needed.
  no-runtime-deps:
    name: Assert no runtime dependencies
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Assert no runtime dependencies
        run: |
          set -euo pipefail
          failed=0
          for pkg in packages/*/package.json; do
            deps="$(node -p "JSON.stringify(require('./${pkg}').dependencies || {})")"
            if [ "${deps}" != "{}" ]; then
              echo "::error file=${pkg}::Verified n8n nodes must have no runtime dependencies, found ${deps}" >&2
              failed=1
            fi
          done
          exit "${failed}"
